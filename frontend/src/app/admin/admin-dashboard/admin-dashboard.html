<div class="dashboard-container">
  <div class="dashboard-tabs">
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'pending'"
      (click)="selectTab('pending')">
      Obrada zahteva za registraciju korisnika
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'workspaces'"
      (click)="selectTab('workspaces')">
      Obrada zahteva za registraciju radnih prostora
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'users'"
      (click)="selectTab('users')">
      Upravljanje korisnicima
    </button>
  </div>

  <div class="dashboard-content">
    @if (activeTab === 'pending') {
      <app-admin-request-view></app-admin-request-view>
    }

    @if (activeTab === 'workspaces') {
      <app-admin-workspace-request-view></app-admin-workspace-request-view>
    }

    @if (activeTab === 'users') {
      <app-admin-user-view></app-admin-user-view>
    }
  </div>
</div>
