<div class="view-panel-container">
    <div class="view-panel-header">
        <h2>Prijava</h2>
    </div>
    
    <div class="view-panel-content login-content">
        <div class="login-form-wrapper">
            <div class="messages">
                @if (msg.message) {
                    <div class="error-message">{{ msg.message }}</div>
                }
            </div>

            <form (ngSubmit)="submit()" #loginForm="ngForm" class="login-form">
                <div class="form-section">
                    <div class="form-group">
                        <label for="username">Korisničko ime: *</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            [(ngModel)]="username" 
                            placeholder="Unesite korisničko ime"
                            [disabled]="loading"
                            required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Lozinka: *</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            [(ngModel)]="password" 
                            placeholder="Unesite lozinku"
                            [disabled]="loading"
                            required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-submit" [disabled]="!loginForm.form.valid || loading">
                        @if (loading) {
                            Prijava u toku...
                        } @else {
                            Prijavi se
                        }
                    </button>
                </div>
            </form>

            <div class="login-footer">
                <a [routerLink]="['/forgotten-password']" class="forgot-link">Zaboravljena lozinka?</a>
            </div>
        </div>
    </div>
</div>
