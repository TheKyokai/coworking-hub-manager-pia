<h2>Zaboravljena lozinka</h2>

<form (ngSubmit)="submit()" #passwordResetForm="ngForm">
	<table>
		<tr>
			<td><label for="identifier">Korisničko ime ili e-mejl:</label></td>
			<td><input type="text" id="identifier" name="identifier" [(ngModel)]="identifier" required /></td>
		</tr>
		<tr>
			<td></td>
			<td>
				<button type="submit" [disabled]="!passwordResetForm.form.valid">Pošalji zahtev</button>
			</td>
		</tr>
	</table>
</form>

<br>
<span style="color: red;">{{msg.message}}</span>

<br>
@if (msg.token && msg.token !== '')
{
    <a [routerLink]="['/reset-password', msg.token]">Promeni lozinku</a>
}
