<div class="view-panel-container">
  <div class="view-panel-header">
    <h2>Zaboravljena lozinka</h2>
  </div>
  
  <div class="view-panel-content forgotten-password-content">
    <div class="forgotten-password-wrapper">
      <div class="messages">
        @if (msg.message) {
          @if (msg.token && msg.token !== '') {
            <div class="success-message">{{ msg.message }}</div>
          } @else {
            <div class="error-message">{{ msg.message }}</div>
          }
        }
      </div>

      @if (!msg.token || msg.token === '') {
        <form (ngSubmit)="submit()" #passwordResetForm="ngForm" class="forgotten-password-form">
          <div class="form-section">
            <div class="form-group">
              <label for="identifier">Korisničko ime ili e-mejl: *</label>
              <input 
                type="text" 
                id="identifier" 
                name="identifier" 
                [(ngModel)]="identifier" 
                [disabled]="loading"
                placeholder="Unesite korisničko ime ili e-mejl"
                required />
            </div>
          </div>

          <div class="form-actions">
            <button 
              type="submit" 
              class="btn btn-submit" 
              [disabled]="!passwordResetForm.form.valid || loading">
              @if (loading) {
                Slanje u toku...
              } @else {
                Pošalji zahtev
              }
            </button>
          </div>
        </form>
      }

      @if (msg.token && msg.token !== '') {
        <div class="reset-link-section">
          <p class="reset-link-message">Zahtev je poslat! Kliknite na link ispod da promenite lozinku:</p>
          <a [routerLink]="['/reset-password', msg.token]" class="reset-link">Promeni lozinku</a>
        </div>
      }
    </div>
  </div>
</div>
